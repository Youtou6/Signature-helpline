<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signature — Modmail Dashboard</title>
  <link rel="stylesheet" href="/dashboard/assets/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="login-body">
  <main class="login-card">
    <p class="eyebrow">Modmail dashboard</p>
    <h1 class="wordmark">SIGNATURE</h1>
    <div class="hairline"></div>
    <form method="POST" action="/login" class="login-form">
      <label for="password">Dashboard password</label>
      <input id="password" name="password" type="password" autofocus required />
      <button type="submit">Enter</button>
    </form>
    <p class="error-msg" id="errorMsg" hidden>Incorrect password. Please try again.</p>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('errorMsg').hidden = false;
    }
  </script>
</body>
</html>
